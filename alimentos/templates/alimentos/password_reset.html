{% extends 'alimentos/base.html' %}
{% load static %}
{% block title %}Recuperar Senha - Stock Guardians{% endblock %}

{% block body %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 85vh;">
    <div class="card border-0 shadow-lg p-4 p-md-5" style="width: 100%; max-width: 500px; border-radius: 20px; background-color: #ffffff;">
        <div class="card-body p-0">
            
            <!-- Ícone ajustado exatamente conforme o desenho -->
            <div class="mb-4 text-center">
                <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3 shadow-sm" style="width: 88px; height: 88px; background-color: #fff4e5; border: 1px solid #ffe0b2;">
                    <i class="bi bi-key-fill" style="color: #e65100; font-size: 2.3rem; transform: scaleX(-1) rotate(-35deg); display: inline-block;"></i>
                </div>
                <h2 class="fw-bold mb-2 text-dark" style="letter-spacing: -0.5px; font-size: 1.75rem;">Recuperar senha</h2>
                <p class="text-muted fs-6 mb-0 px-md-3">
                    Insira o seu e-mail abaixo e enviaremos as instruções para redefinir o seu acesso.
                </p>
            </div>

            <!-- Formulário -->
            <form method="post" class="needs-validation" novalidate>
                {% csrf_token %}
                
                <div class="mb-4">
                    <label for="id_email" class="form-label fw-semibold text-secondary small text-uppercase mb-2" style="letter-spacing: 0.5px;">E-mail cadastrado</label>
                    <div class="input-group input-group-lg">
                        <span class="input-group-text bg-light border-end-0 text-muted ps-3" style="border-top-left-radius: 12px; border-bottom-left-radius: 12px; border-color: #e2e8f0;">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input type="email" name="email" id="id_email" class="form-control bg-light border-start-0 ps-2 fs-6 shadow-none" placeholder="nome@exemplo.com" required autofocus style="border-top-right-radius: 12px; border-bottom-right-radius: 12px; border-color: #e2e8f0;">
                    </div>
                </div>

                <div class="d-grid mb-4">
                    <button type="submit" class="btn btn-lg text-white fw-semibold py-3 shadow-sm" style="background-color: #e65100; border-radius: 12px; font-size: 1rem; transition: opacity 0.2s;">
                        Enviar instruções <i class="bi bi-arrow-right ms-2"></i>
                    </button>
                </div>
            </form>

            <!-- Rodapé Clean -->
            <div class="text-center pt-3 border-top border-light">
                <a href="{% url 'login' %}" class="text-decoration-none fw-semibold text-secondary fs-6 d-inline-flex align-items-center">
                    <i class="bi bi-arrow-left me-2"></i> Voltar para o login
                </a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
