{% load static %}
<aside class="sidebar" id="app-sidebar">
    <div class="brand-lockup d-flex align-items-center gap-2 p-2">
        <img src="{% static 'alimentos/img/logo.jpeg' %}" alt="Stock Guardians" class="brand-logo-img" style="height: 42px; width: auto; object-fit: contain;">
        <span class="d-flex flex-column">
            <strong style="line-height: 1.1;">Stock Guardians</strong>
            <small style="font-size: 0.75rem; color: #6c757d;">gestão de estoque</small>
        </span>
    </div>
    <div class="sidebar-label">Navegação</div>
    <nav class="sidebar-nav" aria-label="Navegação principal">
        <a href="{% url 'dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"><i class="bi bi-grid-1x2-fill"></i> Visão geral</a>
        <a href="{% url 'listar_alimentos' %}" class="nav-link {% if request.resolver_match.url_name == 'listar_alimentos' %}active{% endif %}"><i class="bi bi-boxes"></i> Estoque</a>
        <a href="{% url 'movimentacao_estoque' %}" class="nav-link {% if request.resolver_match.url_name == 'movimentacao_estoque' %}active{% endif %}"><i class="bi bi-arrow-left-right"></i> Movimentação</a>
        <a href="{% url 'relatorios' %}" class="nav-link {% if request.resolver_match.url_name == 'relatorios' %}active{% endif %}"><i class="bi bi-bar-chart-line"></i> Relatórios</a>
    </nav>
    <div class="sidebar-bottom">
        <div class="support-box"><i class="bi bi-lightbulb"></i><div><strong>Dica rápida</strong><span>Mantenha as validades sempre atualizadas.</span></div></div>
        <a href="{% url 'inicio' %}" class="nav-link"><i class="bi bi-box-arrow-left"></i> Sair do sistema</a>
    </div>
</aside>
