{% extends 'alimentos/base.html' %}
{% load static %}
{% block title %}Nova Senha - Stock Guardians{% endblock %}

{% block body %}
<main class="auth-page">
    <section class="auth-card">
        <div class="text-center">
            <span class="eyebrow orange">SEGURANÇA</span>
            <h1>Criar Nova Senha</h1>
            <p class="auth-intro">Por favor, digite a sua nova senha abaixo para atualizar o seu acesso.</p>
        </div>

        <form method="post" class="mt-4">
            {% csrf_token %}
            
            <!-- Renderiza os campos de senha do próprio Django -->
            {{ form.as_p }}
            
            <button type="submit" class="btn btn-primary-custom w-100 justify-content-center mt-3">
                Salvar Nova Senha
            </button>
        </form>
    </section>
</main>
{% endblock %}
