{% extends 'alimentos/base.html' %}
{% load static %}
{% block title %}Nova Senha - Stock Guardians{% endblock %}

{% block body %}
<main class="auth-page">
    <section class="auth-card">
        <span class="eyebrow orange">SEGURANÇA</span>
        <h1>Definir nova senha</h1>
        <p class="auth-intro">Insira sua nova senha abaixo para concluir a alteração.</p>

        <form method="POST" class="demo-form">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn btn-primary-custom w-100 justify-content-center mt-3">
                Alterar senha <i class="bi bi-check-lg"></i>
            </button>
        </form>
    </section>
</main>
{% endblock %}
