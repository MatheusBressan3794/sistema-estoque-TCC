version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: sistema_estoque
      MYSQL_ROOT_PASSWORD: senhadobanco
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psenhadobanco"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: django_app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - MYSQL_DATABASE=sistema_estoque
      - MYSQL_ROOT_PASSWORD=senhadobanco
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: