version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_stock_guardians
    restart: always
    environment:
      POSTGRES_DB: estoque_db
      POSTGRES_USER: admin_tcc
      POSTGRES_PASSWORD: senha_segura_123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: django_estoque
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://admin_tcc:senha_segura_123@db:5432/estoque_db

volumes:
  postgres_data: